[build-system]
requires = ["uv_build>=0.7.19,<0.12"]
build-backend = "uv_build"


[project]
name = "intentopt"
version = "0.1.0"
authors = [
  { name = "Jonathan Berthias", email = "jvberthias@gmail.com" },
]
description = "Optimization with mandatory requirements and prioritized preferences"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = ["cvxpy-base>=1.4.0", "numpy>=1.24", "typing-extensions>=4.5"]

[project.urls]
Homepage = "https://github.com/jonathanberthias/intentopt"
Documentation = "https://jonathanberthias.github.io/intentopt/"
"Bug Tracker" = "https://github.com/jonathanberthias/intentopt/issues"
Discussions = "https://github.com/jonathanberthias/intentopt/discussions"


[dependency-groups]
test = [
  "pytest >=9",
  "pytest-cov >=7",
  "clarabel>=0.11.1",
]
dev = [
  { include-group = "test" },
  "ty>=0.0.89",
  "pyrefly>=1.4.0",
]
docs = [
    "zensical>=0.0.20",
    "mkdocstrings-python",
    # mkdocstrings 1.0 uses the pre-12 highlighting constructor.
    "pymdown-extensions<12",
]


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
strict = true
filterwarnings = [
  "error",
]
log_level = "INFO"
testpaths = [
  "tests",
]


[tool.coverage]
run.source = ["intentopt"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
all = "error"

[tool.pyrefly]
project-includes = ["src", "tests", "examples"]
python-version = "3.11"
preset = "all"

[tool.pyrefly.errors]
# CVXPY's operator decorators and value properties lack complete annotations.
unknown-argument-type = false
unknown-attribute-access = false
unknown-variable-type = false

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
# Validation tests call constructors and solve for their side effects.
unused-call-result = false

[tool.ruff]
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",   # The formatter owns trailing commas.
  "CPY001",   # The repository license covers all source files.
  "D203",     # Use no blank line before class docstrings.
  "D213",     # Start docstring summaries on the first line.
  "D105",     # Standard special methods need no extra docstrings.
  "D107",     # Constructor behavior is documented on the class.
  "PLR09",    # Keep the small solver together rather than splitting for counts.
  "PLR2004",  # Numeric bounds and examples are clearer inline.
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"src/intentopt/**" = ["SLF001"]  # Private helpers are shared within the package.
"src/intentopt/solve.py" = ["ANN401"]  # Solver-specific option values are open-ended.
"**/integrality.py" = ["N812"]  # CVXPY's abs class is imported as Abs.
"**/intention.py" = ["N812"]
"tests/**" = ["D100", "D103", "FBT001", "INP001", "N812", "S101", "SLF001", "T201"]
"examples/**" = ["INP001", "T201"]
