# Read more: https://zensical.org/docs/setup/basics

[project]
site_name = "intentopt"
site_url = "https://jonathanberthias.github.io/intentopt/"
site_description = "Optimization with mandatory requirements and prioritized preferences"
site_author = "Jonathan Berthias"
copyright = "&copy; 2026 Jonathan Berthias"
repo_url = "https://github.com/jonathanberthias/intentopt"
docs_dir = "docs"
nav = [
    { "Get started" = "index.md" },
    { "User guide" = "intentopt.md" },
    { "Examples" = "examples.md" },
    { "Search options" = "advanced.md" },
    { "API reference" = "api.md" },
]

[project.theme]
features = ["content.code.copy", "navigation.footer"]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
